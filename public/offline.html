<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLUB 90s — Offline</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0a0a0a;
        color: #f5f0e8;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main {
        padding: 2rem;
        max-width: 360px;
      }
      .brand {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #c9a84c;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
        color: #e8c96d;
      }
      p {
        color: #a89070;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        background: #c9a84c;
        color: #0a0a0a;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">CLUB 90s</div>
      <h1>You're offline</h1>
      <p>CLUB 90s needs a connection for match, finance, and election data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
